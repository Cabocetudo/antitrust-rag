services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: antitrust_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d antitrust_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_STORE: postgres
      RAG_DATABASE_URL: postgresql://rag:rag@db:5432/antitrust_rag
      RAG_EMBEDDER: ${RAG_EMBEDDER:-sentence-transformers}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-claude-sonnet-5-5}
      RAG_RERANK: ${RAG_RERANK:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/app/.cache/huggingface  # keep downloaded models between restarts

volumes:
  pgdata:
  hf-cache:
