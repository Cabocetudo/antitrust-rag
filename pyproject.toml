[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antitrust-rag"
version = "0.1.0"
description = "Cited question answering over public competition-law texts (Brazil Lei 12.529/2011, EU TFEU Arts. 101-102) with hybrid retrieval and Claude."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guilherme Faria Vaz", email = "guilhermegnr2@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
# Local embedding model + optional cross-encoder reranker (pulls in PyTorch).
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
antitrust-rag-ingest = "antitrust_rag.cli:ingest_main"
antitrust-rag-eval = "antitrust_rag.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: needs a running PostgreSQL + pgvector (set ANTITRUST_RAG_TEST_DSN)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]  # legal texts legitimately contain "§", "º", en dashes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
